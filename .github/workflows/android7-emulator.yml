# Reeed: API 25 device smoke test on an emulator.
#
# Why this exists: P0-1 / P0-2 / P0-9 need a real install (adb install -> Success,
# a launch, df -h /data, a second install over the first). Nobody on the team has
# a physical Android 7.1 phone, so those items sit at "not judged" forever. An
# armeabi-v7a API 25 emulator is not a phone and is NOT a substitute for the
# acceptance run, but it can prove or disprove the things that do not depend on
# the exact handset: does the package install, does the process stay alive, what
# WebView does the system provide, how much space does it need.
#
# It deliberately downloads the APK from the newest successful android7 build:
# the artifact is the only package that passed the four manifest assertions.
#
# Copy this file to .github/workflows/android7-emulator.yml in the fork.
# (The token used to prepare it has no `workflow` scope, so it cannot push here.)

name: android7 emulator smoke

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'android7 build run id that produced the deliverable'
        required: false
        default: '41071093920'
      expected_sha256:
        description: 'sha256 the installed apk must have (empty = do not check)'
        required: false
        default: '6e5a520d5af1cae6aa175a96bc477560fa9269c1f9d4ee93a26c5cc94906dc78'

jobs:
  emulator-api25:
    runs-on: ubuntu-latest
    # An armeabi-v7a image on an x86 host runs under TCG, not KVM: boot alone can
    # eat the whole 90 minutes, so the job has to outlive it.
    timeout-minutes: 180
    # The repository default is `contents: read` only, which makes `gh run list`
    # and `gh run download` fail with 403 before the emulator is ever installed.
    permissions:
      contents: read
      actions: read
    steps:
      - name: free disk space
        run: |
          set +e
          # Never delete anything under $ANDROID_HOME. Dropping sdk/emulator and
          # sdk/ndk makes setup-android@v3 fail with `Failed to find package 'tools'`
          # before it installs anything (run 41026740164, step 4).
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      # `packages:` must be explicit: the action defaults to `tools platform-tools`,
      # and `tools` is no longer published in the SDK repo, so sdkmanager dies with
      # "Failed to find package 'tools'" (run 41026740164, step 4).
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: fetch the deliverable apk (pinned run, resolved name, sha asserted)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID='${{ inputs.source_run_id }}'
          EXPECTED_SHA256='${{ inputs.expected_sha256 }}'
          [ -n "$RUN_ID" ] || { echo "ASSERT FAIL: source_run_id is empty"; exit 1; }
          echo "SOURCE_RUN_ID=$RUN_ID" | tee -a "$GITHUB_ENV"

          # The artifact name carries the build flavour as a suffix:
          #   reeed-minsdk25-armv7-release-extracted-libs        <- deliverable
          #   reeed-minsdk25-armv7-release-extracted-libs-diag   <- diagnostic build
          # The old literal `-n reeed-minsdk25-armv7-release` therefore matched
          # nothing (run 41054495626, step 5) once the suffix was introduced.
          # Resolve the name from the API and refuse anything ambiguous: guessing
          # here means possibly installing the wrong package and reporting it as
          # evidence about the right one.
          mapfile -t CANDIDATES < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
              --jq '.artifacts[].name' \
            | grep -E '^reeed-minsdk25-armv7-release' | grep -v -- '-diag$' | sort
          )
          printf 'ARTIFACT_CANDIDATES=%s\n' "${CANDIDATES[*]:-<none>}"
          if [ "${#CANDIDATES[@]}" -ne 1 ]; then
            echo "ASSERT FAIL: expected exactly 1 non-diag release artifact in run $RUN_ID, got ${#CANDIDATES[@]}"
            exit 1
          fi
          NAME="${CANDIDATES[0]}"
          echo "ARTIFACT_NAME=$NAME" | tee -a "$GITHUB_ENV"

          mkdir -p apk
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$NAME" -D apk
          APK=$(find apk -name '*.apk' | head -n1)
          [ -n "$APK" ] || { echo "ASSERT FAIL: no .apk inside artifact $NAME"; exit 1; }
          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -l "$APK"

          ACTUAL_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "APK_SHA256=$ACTUAL_SHA256" | tee -a "$GITHUB_ENV"
          {
            echo "SOURCE_RUN_ID=$RUN_ID"
            echo "ARTIFACT_NAME=$NAME"
            echo "APK=$APK"
            echo "APK_BYTES=$(stat -c %s "$APK")"
            echo "APK_SHA256=$ACTUAL_SHA256"
            echo "EXPECTED_SHA256=$EXPECTED_SHA256"
          } > "$RUNNER_TEMP/apk-identity.txt"
          cat "$RUNNER_TEMP/apk-identity.txt"

          # Installing a package that is not the published deliverable would make
          # the whole run evidence about the wrong bytes.
          if [ -n "$EXPECTED_SHA256" ] && [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ASSERT FAIL: apk sha256 $ACTUAL_SHA256 != expected $EXPECTED_SHA256"
            exit 1
          fi
          echo "APK_SHA256_ASSERT=passed"

      - name: install emulator and the API 25 armeabi-v7a image
        run: |
          set -euo pipefail
          # The APK is armeabi-v7a only, so an x86 image would fail with
          # INSTALL_FAILED_NO_MATCHING_ABIS and tell us nothing.
          yes | sdkmanager --licenses > /dev/null || true
          # If this image does not exist in the current SDK repo, fail with the list
          # of what API 25 images ARE published instead of a bare "package not found".
          sdkmanager "platform-tools" "emulator" \
            || { sdkmanager --list | grep -i "system-images;android-25" || true; exit 1; }
          sdkmanager "system-images;android-25;google_apis;armeabi-v7a" \
            || { echo "IMAGE_UNAVAILABLE"; sdkmanager --list | grep -i "system-images;android-2[456]" || true; exit 1; }
          echo "yes" | sdkmanager --list_installed | head -20 || true

      - name: create the avd
        run: |
          set +e
          # The diagnostic cat must not kill the job: run 41027825593 died there with
          # "cat: .../api25.avd/config.ini: No such file or directory" although
          # avdmanager said "Auto-selecting single ABI armeabi-v7a". Print what really
          # exists, then let the boot step decide.
          echo "no" | avdmanager create avd -n api25 \
            -k "system-images;android-25;google_apis;armeabi-v7a" -d pixel --force
          echo "CREATE_AVD_EXIT=$?"
          echo "--- avdmanager list avd ---"; avdmanager list avd
          echo "--- emulator -list-avds ---"; "$ANDROID_HOME/emulator/emulator" -list-avds
          echo "--- avd files under \$HOME/.android ---"; find "$HOME/.android" -maxdepth 3 -name '*.ini' 2>/dev/null | head
          cat "$HOME/.android/avd/api25.avd/config.ini" 2>/dev/null | head -20 || echo "NO_CONFIG_INI"

      - name: boot the emulator (software ARM, slow by nature)
        run: |
          set +e
          "$ANDROID_HOME/emulator/emulator" -avd api25 -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb start-server
          adb devices
          timeout 2700 bash -c '
            until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do
              sleep 10
            done'
          BOOT_EXIT=$?
          if [ "$BOOT_EXIT" -ne 0 ]; then
            echo "BOOT_COMPLETED=no"
            adb devices
            tail -40 "$RUNNER_TEMP/emulator.log"
            # A timeout here is a real failure of this job, not a green run with
            # a note: evidence upload still happens (if: always) but the job must
            # not be reported as passing.
            exit 1
          fi
          echo "BOOT_COMPLETED=yes"

      - name: record the device baseline (QA G2-0)
        run: |
          set +e
          {
            echo "release: $(adb shell getprop ro.build.version.release | tr -d '\r')"
            echo "sdk: $(adb shell getprop ro.build.version.sdk | tr -d '\r')"
            echo "abi: $(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
            echo "--- dumpsys webviewupdate (current provider) ---"
            adb shell dumpsys webviewupdate | grep -i current
            echo "--- df -h /data (before install) ---"
            adb shell df -h /data
          } 2>&1 | tee "$RUNNER_TEMP/device-baseline.txt"

      - name: install (P0-1) and install again over it (P0-9)
        run: |
          set +e
          {
            echo "--- adb install -r (first) ---"
            adb install -r "$APK" 2>&1 | tee "$RUNNER_TEMP/install-first.txt"
            FIRST_EXIT=${PIPESTATUS[0]}
            echo "FIRST_INSTALL_EXIT=$FIRST_EXIT"
            echo "--- pm list packages ---"
            adb shell pm list packages | grep -i reeed || echo "PACKAGE_NOT_LISTED"
            echo "--- mark a file inside the app's data dir (P0-9 data survival) ---"
            # google_apis images are userdebug, so adb root works here; on a retail
            # phone this half can only be judged by the app itself.
            adb root > /dev/null 2>&1; sleep 3
            adb shell mkdir -p /data/data/app.reeed.reader/files
            adb shell "echo reeed-marker-$(date +%s) > /data/data/app.reeed.reader/files/p0-9-marker.txt"
            adb shell cat /data/data/app.reeed.reader/files/p0-9-marker.txt
            echo "--- adb install -r (second, over the first) ---"
            adb install -r "$APK" 2>&1 | tee "$RUNNER_TEMP/install-second.txt"
            SECOND_EXIT=${PIPESTATUS[0]}
            echo "SECOND_INSTALL_EXIT=$SECOND_EXIT"
            echo "--- marker after the second install ---"
            adb shell cat /data/data/app.reeed.reader/files/p0-9-marker.txt 2>&1 || echo "MARKER_LOST"
            echo "--- package record (data dir / UID) ---"
            adb shell dumpsys package app.reeed.reader 2>&1 | grep -iE "dataDir|userId|codePath" | head -5
            adb shell ls -ld /data/data/app.reeed.reader 2>&1 | head -3
            echo "--- df -h /data (after install) ---"
            adb shell df -h /data
          } 2>&1 | tee "$RUNNER_TEMP/install.txt"
          # Same rule as the apk assertions: a failed install must fail the job,
          # otherwise a green run is indistinguishable from "never installed".
          grep -q "Success" "$RUNNER_TEMP/install-first.txt" \
            || { echo "ASSERT FAIL: first adb install did not print Success"; exit 1; }
          grep -q "Success" "$RUNNER_TEMP/install-second.txt" \
            || { echo "ASSERT FAIL: second adb install did not print Success"; exit 1; }
          echo "INSTALL_ASSERTIONS=passed"

      - name: launch it and capture what the system says
        run: |
          set +e
          adb logcat -c
          adb shell monkey -p app.reeed.reader -c android.intent.category.LAUNCHER 1 2>&1 | tail -5
          sleep 45
          echo "PID=$(adb shell pidof app.reeed.reader | tr -d '\r')" | tee "$RUNNER_TEMP/launch.txt"
          adb logcat -d > "$RUNNER_TEMP/logcat.txt"
          # The crash buffer is what names the exception; the main buffer
          # often has it wrapped away by the time we read.
          adb logcat -d -b crash > "$RUNNER_TEMP/logcat-crash.txt" 2>&1 || true
          {
            echo "--- WebViewUpgrade ---"
            grep -iE "WebViewUpgrade" "$RUNNER_TEMP/logcat.txt" | tail -20
            echo "--- chromiun/chromium errors ---"
            grep -iE "chromium|cr_|UnsatisfiedLinkError|FATAL EXCEPTION" "$RUNNER_TEMP/logcat.txt" | tail -40
            echo "--- Signal/ANR ---"
            grep -iE "ANR in|signal [0-9]+|tombstone" "$RUNNER_TEMP/logcat.txt" | tail -10
          } 2>&1 | tee -a "$RUNNER_TEMP/launch.txt"
          adb exec-out screencap -p > "$RUNNER_TEMP/screen.png" 2>/dev/null
          ls -l "$RUNNER_TEMP/screen.png"

      - name: collect evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reeed-emulator-api25-evidence
          path: |
            ${{ runner.temp }}/device-baseline.txt
            ${{ runner.temp }}/install.txt
            ${{ runner.temp }}/launch.txt
            ${{ runner.temp }}/logcat.txt
            ${{ runner.temp }}/logcat-crash.txt
            ${{ runner.temp }}/apk-identity.txt
            ${{ runner.temp }}/emulator.log
            ${{ runner.temp }}/screen.png
          if-no-files-found: warn
