name: Android 7.1 (API 25) Reeed APK

# Builds a self-branded (Reeed) armv7 *release* APK whose minSdkVersion is 25,
# so it installs on Android 7.1 / API 25 containers (Kindle e-readers etc.).
# Release (stripped) because the debug APK is ~573 MiB of Rust debug symbols.
# Signed with the FIXED Reeed key (repo secrets REED_*), not a per-run throwaway key:
# a new key on every build makes `adb install -r` fail with INSTALL_FAILED_UPDATE_INCOMPATIBLE,
# which would force a wipe-and-reinstall and lose the user's library (PRD P0-9).
# The verify step is the only evidence chain for minSdk / package / label / largeHeap.

on:
  workflow_dispatch:
    inputs:
      tauri_target:
        description: 'Tauri/Android target (armv7 / arm64 / i686 / x86_64)'
        required: false
        default: 'armv7'
      # Bisect switch for the launch crash (P0-2) on the Kindle container:
      # with extractNativeLibs=false the loader mmaps the 47.5 MiB STORED
      # libreadestlib.so straight out of the APK. A container-style installer can
      # refuse that (UnsatisfiedLinkError at startup). 'true' extracts the .so into
      # /data/app/<pkg>/lib instead, at the cost of ~50 MiB of /data.
      legacy_packaging:
        description: 'Bisect: extract jniLibs on install instead of mmap-ing the APK'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: install NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy vendors (pdfjs, simplecc)
        run: pnpm --filter @readest/readest-app setup-vendors

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: rebrand to Reeed and lower minSdkVersion
        run: |
          python3 scripts/reeed-branding.py
          echo "--- effective tauri config ---"
          jq '{productName, mainBinaryName, identifier, android: .bundle.android, updater: .plugins.updater}' \
            apps/readest-app/src-tauri/tauri.conf.json

      - name: create .env.local
        run: |
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" > .env.local
          cp .env.local apps/readest-app/.env.local

      - name: android init (regenerates gradle from tauri.conf.json)
        working-directory: apps/readest-app
        run: |
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          echo "--- generated applicationId / sdk levels ---"
          grep -nE "applicationId|namespace|minSdk|targetSdk|compileSdk" \
            src-tauri/gen/android/app/build.gradle.kts

      - name: patch generated gradle for plugin flavor dimensions
        env:
          REEED_LEGACY_PACKAGING: ${{ inputs.legacy_packaging == 'true' && '1' || '0' }}
        run: |
          python3 scripts/reeed-patch-gradle.py
          echo "LEGACY_PACKAGING=${{ inputs.legacy_packaging }}"
          grep -n -A4 'packaging {' apps/readest-app/src-tauri/gen/android/app/build.gradle.kts \
            || echo "NO_PACKAGING_BLOCK_IN_GRADLE"

      - name: apply icon
        working-directory: apps/readest-app
        run: pnpm tauri icon ../../data/icons/reeed.png

      - name: build release apk (stripped, not yet signed)
        working-directory: apps/readest-app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          # Make the flavour choice an explicit contract instead of a script default
          # (tauri android build does not forward -P to Gradle).
          ORG_GRADLE_PROJECT_storeFlavor: foss
          ORG_GRADLE_PROJECT_penFlavor: genericPen
        # No --release flag: this Tauri CLI builds release by default (opt out with --debug).
        # run 41015997420 died here with "error: unexpected argument '--release' found".
        run: pnpm tauri android build -t "${{ inputs.tauri_target }}" --apk

      - name: sign release apk with the fixed Reeed keystore
        env:
          KEYSTORE_B64: ${{ secrets.REED_KEYSTORE_B64 }}
          KS_ALIAS: ${{ secrets.REED_KEY_ALIAS }}
          KS_PASS: ${{ secrets.REED_KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.REED_KEY_PASS }}
        run: |
          set -euo pipefail
          APK=$(find apps/readest-app/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | sort | head -n1)
          test -n "$APK"
          test -n "${KEYSTORE_B64:-}" || { echo "ASSERT FAIL: REED_KEYSTORE_B64 secret missing"; exit 1; }
          AAPT2=$(ls -1 "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n1)
          BUILD_TOOLS=$(dirname "$AAPT2")
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/reeed-ci.p12"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/reeed-ci.p12" --ks-type PKCS12 \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --ks-key-alias "$KS_ALIAS" \
            --out "$RUNNER_TEMP/reeed-release.apk" "$RUNNER_TEMP/aligned.apk"
          echo "--- signer certificate (must be identical on every run) ---"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/reeed-release.apk" | grep -i 'SHA-256 digest'
          echo "APK=$RUNNER_TEMP/reeed-release.apk" >> "$GITHUB_ENV"

      - name: verify apk (signature + badging + manifest assertions)
        run: |
          set -euo pipefail
          AAPT2=$(ls -1 "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n1)
          BUILD_TOOLS=$(dirname "$AAPT2")
          echo "APK=$APK"
          ls -l "$APK"
          sha256sum "$APK" | tee "$RUNNER_TEMP/sha256.txt"
          echo "--- apksigner verify ---"
          # Persisted into the artifact, not only the log: P0-9 asks for one fingerprint
          # across builds, and a log that expires cannot answer that question later.
          # -v also prints "Verified using v1/v2/v3 scheme" - Android 7.1 only reads v1
          # and v2, so a v3-only package would pass every other assertion and then fail
          # to install on the device. That line is the only first-hand evidence for it.
          "$BUILD_TOOLS/apksigner" verify -v --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          echo "--- badging ---"
          "$AAPT2" dump badging "$APK" \
            | grep -E "^(package:|sdkVersion:|minSdkVersion:|targetSdkVersion:|native-code:|application-label:)" || true
          echo "--- manifest (largeHeap) ---"
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" | grep -i largeHeap || true
          "$AAPT2" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > "$RUNNER_TEMP/manifest.xmltree.txt"
          echo "--- manifest (uses-sdk) ---"
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" \
            | grep -A4 -i "E: uses-sdk" || echo "NO_USES_SDK_ELEMENT"
          echo "--- full badging (first 40 lines) ---"
          head -40 "$RUNNER_TEMP/badging.txt" || true
          echo "--- merged manifest on disk (where uses-sdk should come from) ---"
          while read -r f; do
            echo "== $f"
            grep -n -i "uses-sdk\|minSdk\|targetSdk" "$f" || echo "  (no uses-sdk/minSdk/targetSdk line in this file)"
          done < <(find apps/readest-app/src-tauri/gen/android/app/build/intermediates -name AndroidManifest.xml 2>/dev/null | head -5)
          echo "--- generated gradle after the build (did tauri regenerate it?) ---"
          grep -n -i "minSdk" apps/readest-app/src-tauri/gen/android/app/build.gradle.kts || echo "NO_MINSDK_TOKEN_IN_GRADLE"
          sed -n '/defaultConfig *{/,/^ *}/p' apps/readest-app/src-tauri/gen/android/app/build.gradle.kts | head -20 || true
          # P0-1 / P0-7 / P0-8: the only evidence chain for these lives here.
          grep -q "package: name='app.reeed.reader'" "$RUNNER_TEMP/badging.txt" \
            || { echo "ASSERT FAIL: package name"; exit 1; }
          # aapt prints the minimum SDK as `sdkVersion:'NN'`; some build-tools versions
          # spell it `minSdkVersion:'NN'`. Both state the same fact (the value is what is
          # asserted), so accept either and say which one matched - same rule we used for
          # largeHeap's `true` vs `0xffffffff`.
          MIN_SDK_LINE=$(grep -E "^(sdkVersion|minSdkVersion):'25'" "$RUNNER_TEMP/badging.txt" || true)
          if [ -n "$MIN_SDK_LINE" ]; then
            echo "$MIN_SDK_LINE"
            echo "MIN_SDK_ASSERT=passed"
          else
            echo "ASSERT FAIL: neither sdkVersion:'25' nor minSdkVersion:'25' in badging"
            exit 1
          fi
          grep -q "application-label:'Reeed'" "$RUNNER_TEMP/badging.txt" \
            || { echo "ASSERT FAIL: application-label"; exit 1; }
          grep -i largeHeap "$RUNNER_TEMP/manifest.xmltree.txt" \
            | grep -qiE "0xffffffff|true" \
            || { echo "ASSERT FAIL: largeHeap missing or not true"; exit 1; }
          # Bisect contract: the requested packaging mode must be the one in the
          # merged manifest. AGP derives android:extractNativeLibs from
          # jniLibs.useLegacyPackaging, so a silently unapplied switch would produce
          # a package that looks like the bisect arm and is not.
          grep -i extractNativeLibs "$RUNNER_TEMP/manifest.xmltree.txt" \
            | tee "$RUNNER_TEMP/extractNativeLibs.txt" || echo "NO_EXTRACTNATIVELIBS_ATTR"
          if [ "${{ inputs.legacy_packaging }}" = "true" ]; then
            grep -qiE "extractNativeLibs.*(=|\(0x[0-9a-f]+\))=true" "$RUNNER_TEMP/manifest.xmltree.txt" \
              || { echo "ASSERT FAIL: legacy_packaging=true but extractNativeLibs is not true"; exit 1; }
            echo "EXTRACT_NATIVE_LIBS_ASSERT=legacy(true)"
          else
            grep -qiE "extractNativeLibs.*=false" "$RUNNER_TEMP/manifest.xmltree.txt" \
              || { echo "ASSERT FAIL: legacy_packaging=false but extractNativeLibs is not false"; exit 1; }
            echo "EXTRACT_NATIVE_LIBS_ASSERT=modern(false)"
          fi
          # P0-1 prerequisite: Android 7.1 verifies v1 and v2 only. A v3-only package
          # installs on nothing older than API 28 while every other assertion is green.
          grep -qE "Verified using v[12] scheme.*: true" "$RUNNER_TEMP/certs.txt" \
            || { echo "ASSERT FAIL: no v1/v2 signature scheme (7.1 cannot install this package)"; exit 1; }
          echo "APK_ASSERTIONS=passed" >> "$GITHUB_ENV"

      - name: css nesting evidence (diagnostic only)
        working-directory: apps/readest-app
        run: |
          set +e
          # Client doc §3: CSS nesting needs Chromium 120. Either the built CSS has
          # no `&`, or we cannot tell whether the glob matched at all - keep the two
          # outcomes distinguishable instead of swallowing both with `|| true`.
          mapfile -t CSS < <(find out -name '*.css' -print 2>/dev/null)
          if [ ${#CSS[@]} -eq 0 ]; then
            echo "NO_CSS_MATCHED"
          else
            echo "css files: ${#CSS[@]}"
            for f in "${CSS[@]}"; do
              printf '%s %s\n' "$(grep -o '&' "$f" | wc -l)" "$f"
            done
            # A raw `&` count is not evidence: Tailwind emits `\&` inside arbitrary
            # variant class names (`.\[\&\>\*\]\:p-2`), which is an escaped character
            # in a selector, not CSS nesting. Only an unescaped `&` can mean nesting,
            # and only the 120-gated shape (declaration after a nested rule) would
            # break on Chromium 119. Count the two separately and dump the shapes.
            echo "--- & contexts (top 25 by frequency) ---"
            for f in "${CSS[@]}"; do
              [ "$(grep -c '&' "$f")" -eq 0 ] && continue
              echo "== $f"
              grep -o '.\{0,28\}&.\{0,28\}' "$f" | sort | uniq -c | sort -rn | head -25
              printf 'BARE_AMP=%s ESC_AMP=%s\n' \
                "$(grep -oP '(?<!\\)&' "$f" | wc -l)" \
                "$(grep -oP '\\&' "$f" | wc -l)"
              # The one rule the 119 question actually turns on, read directly:
              # flattened (`no-spinner::-webkit-*`) or still nested under `&`.
              echo "--- no-spinner shapes ---"
              grep -o '[^{},]*no-spinner[^{},]*' "$f" | sort -u | head -10
            done
          fi

      - name: report apks
        run: |
          find apps/readest-app/src-tauri/gen/android/app/build/outputs -name "*.apk" -printf "%p %s bytes\n" || true
          printf "signed APK: %s bytes\n" "$(stat -c %s "$APK")"

      # Evidence only: uploaded even when an assertion failed above, so a failing
      # run can be diagnosed from badging.txt / manifest.xmltree.txt / certs.txt.
      # The SIGNED apk is NOT here; it goes to the step below, which only runs when
      # every assertion passed. The *unsigned* build output is included on purpose so
      # QA can cross-check the manifest offline instead of waiting for another build;
      # the filename keeps it from being mistaken for a deliverable.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reeed-apk-evidence-${{ inputs.tauri_target }}${{ inputs.legacy_packaging == 'true' && '-legacy' || '' }}
          path: |
            ${{ runner.temp }}/badging.txt
            ${{ runner.temp }}/manifest.xmltree.txt
            ${{ runner.temp }}/extractNativeLibs.txt
            ${{ runner.temp }}/certs.txt
            ${{ runner.temp }}/sha256.txt
            apps/readest-app/src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
            # The built stylesheets, a few hundred KB: the APK stores the frontend
            # brotli-compressed inside libreadestlib.so, so QA cannot grep it there.
            # With these files in hand the nesting question is answerable offline.
            apps/readest-app/out/**/*.css
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: reeed-minsdk25-${{ inputs.tauri_target }}-release${{ inputs.legacy_packaging == 'true' && '-extracted-libs' || '' }}
          path: |
            ${{ env.APK }}
            ${{ runner.temp }}/badging.txt
            ${{ runner.temp }}/manifest.xmltree.txt
            ${{ runner.temp }}/extractNativeLibs.txt
            ${{ runner.temp }}/certs.txt
            ${{ runner.temp }}/sha256.txt
          if-no-files-found: error
